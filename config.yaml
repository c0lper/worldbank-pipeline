# Pipeline configuration.
# To add a country or an indicator, edit this file only; no code changes are needed.

api:
  base_url: https://api.worldbank.org/v2
  per_page: 1000          # max page size; paging is still handled if results exceed it
  timeout_seconds: 30
  max_retries: 4          # retries after the first attempt (5xx, 429, timeouts, invalid JSON)
  backoff_seconds: 2      # exponential backoff: 2, 4, 8, 16 seconds

storage:
  database: data/worldbank.duckdb
  reports_dir: reports

years:
  start: 2018
  end: 2024

# ISO 3166-1 alpha-3 codes
countries: [BRA, CAN, DEU, GBR, IND, JPN, MEX, USA, ZAF]

# aggregation: how the indicator is rolled up across countries (income group view)
#   sum          -> plain sum (stock/flow values such as population or GDP)
#   weighted_avg -> average weighted by another indicator (e.g. population)
# valid_range: [min, max] used by the range data-quality check
indicators:
  - code: SP.POP.TOTL
    name: Population, total
    unit: people
    aggregation: sum
    valid_range: [1, 10000000000]

  - code: NY.GDP.MKTP.CD
    name: GDP (current US$)
    unit: current US$
    aggregation: sum
    valid_range: [1, 1.0e+15]

  - code: NY.GDP.PCAP.CD
    name: GDP per capita (current US$)
    unit: current US$
    aggregation: weighted_avg
    weight_indicator: SP.POP.TOTL
    valid_range: [1, 500000]

  - code: SP.DYN.LE00.IN
    name: Life expectancy at birth, total (years)
    unit: years
    aggregation: weighted_avg
    weight_indicator: SP.POP.TOTL
    valid_range: [20, 100]

quality:
  # Related indicators must agree: expected ~= numerator / denominator
  consistency_rules:
    - name: gdp_per_capita_vs_gdp_over_population
      numerator: NY.GDP.MKTP.CD
      denominator: SP.POP.TOTL
      expected: NY.GDP.PCAP.CD
      tolerance_pct: 2
  # Warn when more than this share of the expected country-indicator-year grid is missing
  max_missing_pct: 25
